name: build

on:
  push:
    branches: [scrdock-mods]
    # Tag convention: scrdock-v<upstream>-<patch>, e.g. scrdock-v4.1-1
    # (release #1 based on upstream scrcpy v4.1).
    tags: ['scrdock-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Derive the base scrcpy version from meson.build so the server jar,
      # package name and release notes always match the synced source.
      - name: Detect scrcpy base version
        id: ver
        run: |
          v="$(sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p" meson.build | head -n1)"
          test -n "$v"
          echo "base version: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-tools libz-mingw-w64-dev nasm zip unzip meson ninja-build

      # Uses the repo's own dependency scripts (app/deps/*.sh) to build
      # SDL3, FFmpeg, dav1d, libusb and fetch adb from source, then
      # cross-compiles the client only (-Dcompile_server=false).
      - name: Build client (win64)
        run: bash release/build_windows.sh 64

      # The scrdock-mods patch only touches the client; the server is
      # identical to upstream, so reuse the official artifact instead of
      # setting up an Android toolchain. The URL is derived from the
      # detected version: if upstream master moved to an unreleased
      # version (no official server jar yet), this fails loudly instead
      # of shipping a mismatched server.
      - name: Fetch matching official server
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p release/work/build-server/server
          curl -fL -o release/work/build-server/server/scrcpy-server \
            "https://github.com/Genymobile/scrcpy/releases/download/v${V}/scrcpy-server-v${V}"

      - name: Package
        run: |
          cd release
          VERSION="scrdock-${{ steps.ver.outputs.v }}-${GITHUB_SHA:0:7}" ./package_client.sh win64 zip

      - uses: actions/upload-artifact@v4
        with:
          name: scrdock-win64
          path: release/output/*

      - name: Create GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/output/* \
            --title "scrcpy ${{ steps.ver.outputs.v }} + scrdock 补丁" \
            --notes "基于 upstream scrcpy ${{ steps.ver.outputs.v }} + scrdock-mods 补丁:
          - MOD+e 直开设置面板（不先弹通知栏）
          - 版本横幅打印 'scrdock-mods' 标记（供 scrdock 工具栏检测）

          Server 为官方 scrcpy-server v${{ steps.ver.outputs.v }}（补丁不涉及 server 代码）。"
